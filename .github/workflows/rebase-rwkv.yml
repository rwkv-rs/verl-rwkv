name: Rebase RWKV on upstream verl

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 10:15 is 04:15 CST / 05:15 CDT.
    - cron: "15 10 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rebase-rwkv
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out rwkv
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: rwkv
          fetch-depth: 0

      - name: Prepare review candidate
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/verl-project/verl.git
          else
            git remote add upstream https://github.com/verl-project/verl.git
          fi

          git fetch origin rwkv
          git fetch upstream main

          old_head="$(git rev-parse refs/remotes/origin/rwkv)"
          upstream_head="$(git rev-parse refs/remotes/upstream/main)"
          git switch --force-create rwkv "$old_head"

          rwkv_commit_count="$(git rev-list --count "$upstream_head"..HEAD)"
          if [[ "$rwkv_commit_count" == "0" ]]; then
            echo "rwkv has no commits ahead of upstream/main; refusing a plain-upstream candidate."
            exit 1
          fi

          echo "Replaying $rwkv_commit_count rwkv commits on top of $upstream_head."
          set +e
          git rebase "$upstream_head"
          rebase_status=$?
          set -e

          if [[ "$rebase_status" != "0" ]]; then
            conflict_commit="$(git rev-parse REBASE_HEAD 2>/dev/null || printf unknown)"
            unresolved_paths="$(git diff --name-only --diff-filter=U)"

            {
              echo "changed=false"
              echo "conflicted=true"
              echo "old_head=$old_head"
              echo "upstream_head=$upstream_head"
              echo "conflict_commit=$conflict_commit"
              echo "unresolved_paths<<RWKV_PATHS"
              printf '%s\n' "$unresolved_paths"
              echo "RWKV_PATHS"
            } >> "$GITHUB_OUTPUT"

            {
              echo "## RWKV upstream sync conflict"
              echo
              echo "- Baseline head: $old_head"
              echo "- Upstream head: $upstream_head"
              echo "- Conflict commit: $conflict_commit"
              echo "- Unresolved paths:"
              printf '%s\n' "$unresolved_paths" | sed 's/^/  - /'
            } >> "$GITHUB_STEP_SUMMARY"

            git rebase --abort
            exit "$rebase_status"
          fi

          candidate_head="$(git rev-parse HEAD)"
          if [[ "$candidate_head" == "$old_head" ]]; then
            echo "rwkv is already based on the latest upstream/main."
            {
              echo "changed=false"
              echo "conflicted=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          post_rebase_commit_count="$(git rev-list --count "$upstream_head"..HEAD)"
          if [[ "$post_rebase_commit_count" == "0" ]]; then
            echo "Rebase removed every rwkv commit; refusing to publish a candidate."
            exit 1
          fi

          sensitive_paths="$(
            git diff --name-only "$old_head" HEAD |
              grep -Ei '(^|/)(prompt|prompts|template|templates|tokenizer|tokenizers|stop|tool|tools|reward)([^/]*)(/|$)' ||
              true
          )"
          if [[ -n "$sensitive_paths" ]]; then
            sensitive=true
          else
            sensitive=false
          fi

          {
            echo "changed=true"
            echo "conflicted=false"
            echo "old_head=$old_head"
            echo "upstream_head=$upstream_head"
            echo "candidate_head=$candidate_head"
            echo "sensitive=$sensitive"
            echo "sensitive_paths<<RWKV_PATHS"
            printf '%s\n' "$sensitive_paths"
            echo "RWKV_PATHS"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## RWKV upstream sync candidate"
            echo
            echo "- Baseline head: $old_head"
            echo "- Upstream head: $upstream_head"
            echo "- Candidate head: $candidate_head"
            echo "- Sensitive-path gate: $sensitive"
            if [[ -n "$sensitive_paths" ]]; then
              echo "- Sensitive paths:"
              printf '%s\n' "$sensitive_paths" | sed 's/^/  - /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push candidate and open review PR
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_HEAD: ${{ steps.sync.outputs.old_head }}
          UPSTREAM_HEAD: ${{ steps.sync.outputs.upstream_head }}
          CANDIDATE_HEAD: ${{ steps.sync.outputs.candidate_head }}
          SENSITIVE: ${{ steps.sync.outputs.sensitive }}
          SENSITIVE_PATHS: ${{ steps.sync.outputs.sensitive_paths }}
        run: |
          set -euo pipefail

          candidate_branch="automation/rebase-rwkv"
          git fetch origin "$candidate_branch" || true
          candidate_remote_head="$(
            git rev-parse --verify "refs/remotes/origin/$candidate_branch" 2>/dev/null ||
              true
          )"
          if [[ -n "$candidate_remote_head" ]]; then
            git push               --force-with-lease="refs/heads/$candidate_branch:$candidate_remote_head"               origin HEAD:"$candidate_branch"
          else
            git push origin HEAD:"$candidate_branch"
          fi

          body_file="$(mktemp)"
          cat >"$body_file" <<EOF
          Automated upstream sync candidate for rwkv.

          - Previous rwkv head: $OLD_HEAD
          - Upstream main head: $UPSTREAM_HEAD
          - Candidate head: $CANDIDATE_HEAD
          - Sensitive-path gate: $SENSITIVE

          Sensitive paths:
          ${SENSITIVE_PATHS:-none}

          This workflow never updates rwkv directly. Merge only after generic VERL
          and RWKV-specific validation, and when blocked, explicit
          sensitive-semantics review.
          EOF

          pr_number="$(
            gh pr list               --head "$candidate_branch"               --base rwkv               --state open               --json number               --jq '.[0].number // empty'
          )"

          if [[ -z "$pr_number" ]]; then
            gh pr create               --base rwkv               --head "$candidate_branch"               --title "ci(rwkv): rebase on upstream main"               --body-file "$body_file"
            pr_number="$(
              gh pr list                 --head "$candidate_branch"                 --base rwkv                 --state open                 --json number                 --jq '.[0].number'
            )"
          else
            gh pr edit "$pr_number"               --title "ci(rwkv): rebase on upstream main"               --body-file "$body_file"
          fi

          if [[ "$SENSITIVE" == "true" ]]; then
            gh label create sensitive-semantics-review-required               --color D73A4A               --description "Requires explicit review of prompt/tokenizer/tool semantics"               --force
            gh pr edit "$pr_number" --add-label sensitive-semantics-review-required
          fi

      - name: Fail closed on sensitive paths
        if: steps.sync.outputs.changed == 'true' && steps.sync.outputs.sensitive == 'true'
        shell: bash
        run: |
          echo "::error::Sensitive paths changed; explicit human review is required."
          exit 1
